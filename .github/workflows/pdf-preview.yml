name: PDF preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/src/main/java/com/zimdarselectric/app/data/QuotePdf.kt", "app/src/main/java/com/zimdarselectric/app/data/St124Pdf.kt", "app/src/androidTest/**", ".github/workflows/pdf-preview.yml"]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build app + test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PallAbis --no-daemon
      - name: Run on emulator and pull pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.zimdarselectric.app.test/androidx.test.runner.AndroidJUnitRunner | tee instr.txt
            mkdir -p preview && adb pull /sdcard/Android/data/com.zimdarselectric.app/files/preview/. preview/
            ls -la preview
      - name: Publish pages as a preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat instr.txt
          grep -q "OK (1 test)" instr.txt
          cd preview && zip -q ../pdf-preview.zip *.png && cd ..
          gh release view ci-preview >/dev/null 2>&1 || gh release create ci-preview --prerelease --title "PDF preview (test output)" --notes "Test pictures of the quote PDFs. Not an app update."
          gh release upload ci-preview pdf-preview.zip --clobber
