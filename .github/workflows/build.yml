name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Where the app checks for updates. Defaults to this repo; set the RELEASES_REPO variable
      # (and a RELEASES_TOKEN secret) to publish to a separate public releases repo instead.
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          APK="ZimdarsElectric-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          NOTES="$(git log -1 --pretty=%s)"
          gh release create "v${VERSION}" "$APK" --repo "$RELEASES_REPO" --title "Zimdars Electric v${VERSION}" --notes "$NOTES"
