name: Signing page
on:
  push:
    branches: [main]
    paths: ["docs/**", "desktop/src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Add the PC app as a web page (docs/pc)
        run: |
          npm pack xlsx@0.18.5 --silent && tar xzf xlsx-0.18.5.tgz && cp package/dist/xlsx.full.min.js desktop/src/vendor/xlsx.full.min.js
          mkdir -p docs/pc/vendor
          cp desktop/src/index.html desktop/src/styles.css desktop/src/logic.js desktop/src/formula.js desktop/src/sheets.js desktop/src/app.js desktop/src/manifest.json desktop/src/icon.png docs/pc/
          cp desktop/src/vendor/xlsx.full.min.js docs/pc/vendor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
