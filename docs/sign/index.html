<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Quote to sign</title>
<style>
  :root {
    --ink: #1c1f21; --muted: #5d656b; --line: #d9dde0; --paper: #ffffff; --wash: #f3f4f5;
    --band: #1c1f21; --neon: #dcff34; --ok: #2e8f5b; --warn: #c2410c;
    --cond: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .sheet { max-width: 760px; margin: 0 auto; background: var(--paper); min-height: 100vh; }
  header { background: var(--band); color: #f2f3f3; padding: 22px 20px 18px; border-bottom: 4px solid var(--neon); }
  header h1 { margin: 0; font: 700 26px/1.1 var(--cond); letter-spacing: .5px; text-transform: uppercase; }
  header .contact { margin-top: 6px; font-size: 13px; color: #c9cdd0; }
  header .contact a { color: #c9cdd0; }
  main { padding: 6px 20px 40px; }
  .kicker { font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  h2 { font: 700 15px/1.2 var(--cond); text-transform: uppercase; letter-spacing: 1px; margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .qnum { font: 700 30px/1 var(--cond); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .muted { color: var(--muted); }
  .scope { white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 8px 6px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 9px 6px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n, th.n { text-align: right; padding-right: 0; padding-left: 12px; white-space: nowrap; }
  .totals { margin-left: auto; max-width: 340px; }
  .totals div { display: flex; justify-content: space-between; padding: 5px 0; }
  .totals .grand { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 10px; font: 700 24px/1 var(--cond); }
  .note { background: var(--wash); border-left: 3px solid var(--ink); padding: 10px 12px; font-size: 14px; margin: 10px 0; }
  .notices { font-size: 13.5px; color: #333a3f; }
  .notices p { margin: 0 0 8px; }
  .signbox { margin-top: 28px; border: 2px solid var(--ink); padding: 16px; }
  label.field { display: block; font-size: 14px; margin: 12px 0 4px; font-weight: 600; }
  input[type=text] { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #9aa2a8; border-radius: 0; }
  .agree { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0 6px; font-size: 15px; }
  .agree input { width: 26px; height: 26px; flex: none; margin-top: 2px; accent-color: var(--ink); }
  .pad-wrap { position: relative; margin-top: 6px; }
  canvas#pad { width: 100%; height: 190px; background: #fbfbfb; border: 1px dashed #8a9399; touch-action: none; display: block; }
  .pad-line { position: absolute; left: 16px; right: 16px; bottom: 44px; border-bottom: 1px solid #b9c0c5; pointer-events: none; }
  .pad-x { position: absolute; left: 16px; bottom: 48px; color: #8a9399; font: 700 18px var(--cond); pointer-events: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
  button { font: 700 16px var(--cond); text-transform: uppercase; letter-spacing: 1px; border: 0; cursor: pointer; }
  .btn { background: var(--ink); color: var(--neon); padding: 16px 20px; width: 100%; margin-top: 16px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .link { background: none; color: var(--ink); text-decoration: underline; padding: 6px 0; font-size: 14px; }
  .err { color: var(--warn); font-weight: 600; margin-top: 10px; min-height: 1em; }
  .signed { border: 2px solid var(--ok); padding: 16px; margin-top: 28px; }
  .signed .badge { color: var(--ok); font: 700 20px var(--cond); text-transform: uppercase; }
  .signed img { max-width: 320px; width: 100%; display: block; margin: 8px 0; border-bottom: 1px solid var(--ink); }
  .center { padding: 60px 20px; text-align: center; }
  .addon { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .addon input { width: 24px; height: 24px; flex: none; accent-color: var(--ink); margin-top: 1px; }
  .addon .nm { flex: 1; } .addon .pr { font-weight: 700; white-space: nowrap; }
  .optlist { display: grid; gap: 10px; margin: 8px 0 4px; }
  .optcard { text-transform: none; letter-spacing: normal; text-align: left; border: 1.5px solid var(--line); background: #fff; padding: 14px; font: inherit; color: var(--ink); cursor: pointer; width: 100%; }
  .optcard.on { border: 2.5px solid var(--ink); box-shadow: inset 6px 0 0 var(--neon); }
  .optcard .ol { font: 700 13px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: #5b636a; }
  .optcard .ot { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 17px; margin-top: 4px; }
  .optcard .os { font-size: 14px; color: #5b636a; margin-top: 4px; }
  .depbox { border: 2px solid var(--ink); padding: 16px; margin-top: 18px; }
  .depbox .amt { font: 700 30px var(--cond); margin: 4px 0 6px; }
  .depbox .btn { margin-top: 10px; display: block; text-align: center; text-decoration: none; }
  .btn-line2 { display: block; text-align: center; border: 1.5px solid var(--ink); padding: 14px; margin-top: 10px; background: #fff; color: var(--ink); font: 700 15px var(--cond); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; width: 100%; }
  .yourtotal { display: flex; justify-content: space-between; font: 700 22px var(--cond); margin-top: 12px; padding: 10px 0; border-top: 2px solid var(--ink); }
  .st124 { border: 1px solid #9aa2a8; background: #f6f7f3; padding: 14px; margin: 16px 0 6px; }
  .st124 .opts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 6px 0 10px; font-size: 15px; }
  .st124 .opts label { display: flex; align-items: center; gap: 8px; }
  .st124 .opts input { width: 22px; height: 22px; accent-color: var(--ink); }
  .st124 .q { font-size: 14px; font-weight: 600; margin-top: 8px; }
  ul.cert { font-size: 14px; padding-left: 20px; } ul.cert li { margin: 4px 0; }
  .print { margin-top: 14px; }
  @media print {
    body { background: #fff; }
    header { background: #fff; color: #000; border-bottom: 2px solid #000; }
    header .contact, header .contact a { color: #000; }
    .noprint { display: none !important; }
    h2 { break-after: avoid; }
    tr, .signed, .note { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div id="app"><div class="center muted">Loading your quote…</div></div>
</div>
<script>
(function () {
  "use strict";
  var API = "https://dmaslbfwpsfnnnyushbc.supabase.co/functions/v1/sign";
  var token = new URLSearchParams(location.search).get("t") || "";
  var app = document.getElementById("app");
  var chosenAddons = [];
  var chosenOption = null;
  var depositEl = null;

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "cls") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function money(v) { return (Number(v) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" }); }
  function qty(v) { v = Number(v) || 0; return Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100); }
  function day(ms) { return ms ? new Date(ms).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) : ""; }
  function stamp(iso) { return new Date(iso).toLocaleString("en-US", { dateStyle: "long", timeStyle: "short" }); }
  function message(title, body) {
    app.innerHTML = "";
    app.appendChild(el("div", { cls: "center" }, [el("h2", { text: title }), el("p", { cls: "muted", text: body })]));
  }

  if (!/^[A-Za-z0-9_-]{20,64}$/.test(token)) { message("Link not valid", "Please use the full link from your text or email."); return; }

  fetch(API + "?t=" + encodeURIComponent(token), { cache: "no-store" })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) { message("Quote not found", "This link may be wrong or the quote was removed. Please contact the contractor."); return; }
      render(res.j);
    })
    .catch(function () { message("Can't load the quote", "Check your connection and open the link again."); });

  function render(d) {
    if (d.kind === "st124") { renderSt124(d); return; }
    var p = d.payload || {};
    var opts = p.options || [];
    if (opts.length) {
      if (d.status === "signed" && d.choice) chosenOption = d.choice;
      if (chosenOption == null || !opts.some(function (o) { return o.id === chosenOption; })) chosenOption = opts[0].id;
      var co = opts.filter(function (o) { return o.id === chosenOption; })[0];
      p = Object.assign({}, p, { quote: Object.assign({}, p.quote, co.quote || {}), lines: co.lines || [], labor: co.labor || {}, parts: co.parts || {}, totals: co.totals || {}, st124: co.st124 || null });
    }
    var b = p.business || {}, c = p.customer || {}, q = p.quote || {}, t = p.totals || {}, terms = p.terms || {};
    document.title = (b.name || "Quote") + " · " + (q.number || d.quote_number);
    app.innerHTML = "";

    var contact = [b.phone, b.email, b.address].filter(Boolean).join(" · ");
    var lic = [b.license ? "License " + b.license : "", b.insurer ? "Insured: " + b.insurer : ""].filter(Boolean).join(" · ");
    app.appendChild(el("header", null, [
      el("h1", { text: b.name || "Quote" }),
      el("div", { cls: "contact", text: contact }),
      lic ? el("div", { cls: "contact", text: lic }) : null,
    ]));

    var m = el("main");
    app.appendChild(m);

    m.appendChild(el("div", { cls: "title-row" }, [
      el("div", null, [el("div", { cls: "kicker", text: q.changeOf ? "Change order to " + q.changeOf : "Quote" }), el("div", { cls: "qnum", text: q.number || d.quote_number })]),
      el("div", { cls: "muted", style: "text-align:right;font-size:14px" }, [
        el("div", { text: "Date: " + day(q.date) }),
        q.validUntil ? el("div", { text: "Good until: " + day(q.validUntil) }) : null,
      ]),
    ]));
    if (d.status === "canceled") {
      m.appendChild(el("div", { cls: "note", text: "This quote was replaced or canceled, so it can't be signed. Please contact " + (b.name || "the contractor") + (b.phone ? " at " + b.phone : "") + "." }));
    }

    if (opts.length) {
      var signedOpt = d.status === "signed";
      m.appendChild(el("h2", { text: signedOpt ? "Option chosen" : "Choose an option" }));
      if (!signedOpt) m.appendChild(el("p", { cls: "muted", style: "font-size:14px;margin:4px 0", text: "Tap one to see its details and price below. You'll sign for the one you pick." }));
      var box = el("div", { cls: "optlist" });
      opts.forEach(function (o) {
        if (signedOpt && o.id !== chosenOption) return;
        var on = o.id === chosenOption;
        var bt = el("button", { cls: "optcard" + (on ? " on" : ""), type: "button" }, [
          el("div", { cls: "ol", text: (on ? "✓ " : "") + (o.label || "Option") }),
          el("div", { cls: "ot" }, [el("span", { text: (o.quote && o.quote.title) || "" }), el("span", { text: money(o.totals && o.totals.total) })]),
          o.summary ? el("div", { cls: "os", text: o.summary }) : null,
        ]);
        if (!signedOpt) bt.addEventListener("click", function () {
          if (chosenOption === o.id) return;
          var y = window.scrollY; chosenOption = o.id; render(d); window.scrollTo(0, y);
        });
        box.appendChild(bt);
      });
      m.appendChild(box);
    }

    m.appendChild(el("h2", { text: "Customer and job" }));
    m.appendChild(el("div", { cls: "grid" }, [
      el("div", null, [el("div", { cls: "kicker", text: "Customer" }), el("div", { text: c.name || "" }),
        c.phone ? el("div", { cls: "muted", text: c.phone }) : null, c.email ? el("div", { cls: "muted", text: c.email }) : null]),
      el("div", null, [el("div", { cls: "kicker", text: "Job site" }), el("div", { text: q.site || c.address || "" })]),
      el("div", null, [el("div", { cls: "kicker", text: "Type of work" }),
        el("div", { text: q.jobType === "REPAIR" ? "Repair / maintenance" : q.jobType === "BOTH" ? "New installation (capital improvement) and repair, listed separately" : "New installation (capital improvement)" })]),
      el("div", null, [el("div", { cls: "kicker", text: "Planned dates" }), el("div", { text: q.scheduled || "To be scheduled together" })]),
    ]));
    var both = q.jobType === "BOTH";
    if (q.title || q.notes || q.repairNotes) {
      m.appendChild(el("h2", { text: "Work to be done" }));
      if (q.title) m.appendChild(el("p", { style: "font-weight:600;margin:4px 0", text: q.title }));
      if (both && q.notes) m.appendChild(el("p", { style: "font-weight:600;margin:8px 0 2px", text: "New installation" }));
      if (q.notes) m.appendChild(el("p", { cls: "scope", text: q.notes }));
      if (both && q.repairNotes) {
        m.appendChild(el("p", { style: "font-weight:600;margin:8px 0 2px", text: "Repair" }));
        m.appendChild(el("p", { cls: "scope", text: q.repairNotes }));
      }
    }

    var all = p.lines || [];
    var groups = both ? [["Materials · new installation", all.filter(function (l) { return !l.repair; })], ["Materials · repair", all.filter(function (l) { return l.repair; })]]
      : [["Materials", all]];
    groups.forEach(function (g) {
      var lines = g[1];
      if (!lines.length) return;
      m.appendChild(el("h2", { text: g[0] }));
      var tb = el("tbody");
      lines.forEach(function (l) {
        tb.appendChild(el("tr", null, [
          el("td", { text: l.name }), el("td", { cls: "n", text: qty(l.qty) + " " + (l.unit || "") }),
          el("td", { cls: "n", text: money(l.price) }), el("td", { cls: "n", text: money(l.total) }),
        ]));
      });
      m.appendChild(el("table", null, [el("thead", null, [el("tr", null, [
        el("th", { text: "Item" }), el("th", { cls: "n", text: "Qty" }), el("th", { cls: "n", text: "Each" }), el("th", { cls: "n", text: "Amount" }),
      ])]), tb]));
    });

    m.appendChild(el("h2", { text: "Price" }));
    var tot = el("div", { cls: "totals" });
    function trow(k, v, cls) { tot.appendChild(el("div", cls ? { cls: cls } : null, [el("span", { text: k }), el("span", { text: v })])); }
    var lab = p.labor || {};
    if (both) {
      var sum = function (rep) { return all.filter(function (l) { return !!l.repair === rep; }).reduce(function (a, l) { return a + (l.total || 0); }, 0); };
      var parts = p.parts || {};
      trow("Install materials", money(sum(false)));
      trow("Install labor (" + qty(lab.hours || 0) + " hr)", money(lab.installAmount || 0));
      trow("New installation subtotal", money(parts.install || 0));
      trow("Repair materials", money(sum(true)));
      trow("Repair labor (" + qty(lab.repairHours || 0) + " hr)", money(lab.repairAmount || 0));
      trow("Repair subtotal", money(parts.repair || 0));
      trow("Sales tax (" + qty(t.taxRate) + "%) on repair", money(t.tax));
    } else {
      trow("Materials", money(t.materials));
      trow(lab.hours ? "Labor (" + qty(lab.hours) + " hr)" : "Labor", money(t.labor));
      if (q.jobType === "REPAIR") trow("Sales tax (" + qty(t.taxRate) + "%)", money(t.tax));
    }
    trow("Total", money(t.total), "grand");
    m.appendChild(tot);
    var addons = p.addons || [];
    if (addons.length) {
      var taxRate = (Number(t.taxRate) || 0) / 100;
      var priceOf = function (a) { return a.price * (1 + (a.taxable ? taxRate : 0)); };
      m.appendChild(el("h2", { text: "Optional add-ons" }));
      var picked = d.status === "signed" ? (d.addons || []) : null;
      if (picked) {
        addons.forEach(function (a) {
          m.appendChild(el("div", { cls: "addon" }, [el("span", { cls: "nm", text: (picked.indexOf(a.id) >= 0 ? "✓ Added: " : "Not added: ") + a.name }),
            el("span", { cls: "pr", text: money(priceOf(a)) })]));
        });
      } else {
        m.appendChild(el("p", { cls: "muted", style: "font-size:14px;margin:4px 0", text: "Check anything you'd like added. Your total updates below." }));
        var yt = el("span", { text: money(t.total) });
        var update = function () {
          var sum = 0; addons.forEach(function (a) { if (chosenAddons.indexOf(a.id) >= 0) sum += priceOf(a); });
          yt.textContent = money(t.total + sum);
          if (depositEl) depositEl.textContent = depositText(p.deposit, t.total + sum);
        };
        addons.forEach(function (a) {
          var cb = el("input", { type: "checkbox" });
          cb.checked = chosenAddons.indexOf(a.id) >= 0;
          cb.addEventListener("change", function () {
            chosenAddons = chosenAddons.filter(function (x) { return x !== a.id; });
            if (cb.checked) chosenAddons.push(a.id);
            update();
          });
          m.appendChild(el("label", { cls: "addon" }, [cb, el("span", { cls: "nm" }, [a.name, a.note ? el("div", { cls: "muted", style: "font-size:13px", text: a.note }) : null]),
            el("span", { cls: "pr", text: "+" + money(priceOf(a)) })]));
        });
        m.appendChild(el("div", { cls: "yourtotal" }, [el("span", { text: "Your total" }), yt]));
        setTimeout(update, 0);
      }
    }
    if (p.financing && p.financing.url) {
      m.appendChild(el("p", { style: "font-size:15px;margin:12px 0 0" }, [el("b", { text: "Pay over time: " }),
        el("a", { href: p.financing.url, target: "_blank", rel: "noopener", text: p.financing.text || "See financing options →" })]));
    }
    if (both) {
      m.appendChild(el("div", { cls: "note", text: "The new installation is a capital improvement to your property, so it has no sales tax; you'll be asked to sign New York State form ST-124 for that part. Sales tax is charged on the repair part only." }));
    } else if (q.jobType !== "REPAIR") {
      m.appendChild(el("div", { cls: "note", text: "No sales tax: this is a capital improvement to your property. You'll be asked to sign New York State form ST-124 (Certificate of Capital Improvement) to confirm this." }));
    }

    m.appendChild(el("h2", { text: "Terms" }));
    if (terms.rates) m.appendChild(el("p", null, [el("b", { text: "How I charge: " }), terms.rates]));
    if (terms.payment) m.appendChild(el("p", null, [el("b", { text: "Payment: " }), terms.payment]));
    if (terms.warranty) m.appendChild(el("p", null, [el("b", { text: "Warranty: " }), terms.warranty]));
    var notices = el("div", { cls: "notices" });
    (p.notices || []).forEach(function (n) { notices.appendChild(el("p", { text: n })); });
    m.appendChild(notices);

    // What the customer is agreeing to pay in total (with the add-ons they picked).
    var grand = function () {
      var picked = d.status === "signed" ? (d.addons || []) : chosenAddons, rate = (Number(t.taxRate) || 0) / 100;
      return (Number(t.total) || 0) + (p.addons || []).reduce(function (a, x) { return a + (picked.indexOf(x.id) >= 0 ? x.price * (1 + (x.taxable ? rate : 0)) : 0); }, 0);
    };
    var dep = p.deposit && Number(p.deposit.pct) > 0 ? p.deposit : null;
    if (d.status === "signed") {
      m.appendChild(signedBlock(d.signer_name, d.signed_at, d.signature_png, b, d.st124));
      if (dep && !dep.paid) m.appendChild(depositBox(dep, grand(), q.number || d.quote_number, b));
      return;
    }
    if (d.status !== "sent") return;
    depositEl = null;
    if (dep) {
      depositEl = el("div", { cls: "note", text: depositText(dep, grand()) });
      m.appendChild(depositEl);
    }
    m.appendChild(signBlock(d, b, p.st124 ? "quote+st124" : "quote", function () { return dep ? depositBox(dep, grand(), q.number || d.quote_number, b) : null; }));
  }

  function depositAmount(dep, total) { return Math.round(total * Number(dep.pct)) / 100; }
  function depositText(dep, total) {
    return "A " + qty(dep.pct) + "% deposit (" + money(depositAmount(dep, total)) + ") is due when you sign, to order materials and reserve your spot. The rest is due when the job is done. Ways to pay show after you sign.";
  }
  function depositBox(dep, total, number, b) {
    var amt = depositAmount(dep, total);
    var box = el("div", { cls: "depbox" }, [el("div", { cls: "kicker", text: "Deposit due now" }), el("div", { cls: "amt", text: money(amt) }),
      el("div", { cls: "muted", style: "font-size:14px", text: qty(dep.pct) + "% of " + money(total) + ". The rest is due when the job is done." })]);
    if (dep.card) box.appendChild(el("a", { cls: "btn", href: String(dep.card).replace("{amount}", amt.toFixed(2)), target: "_blank", rel: "noopener", text: "Pay " + money(amt) + " by card" }));
    if (dep.venmo) {
      var user = String(dep.venmo).replace(/^@/, "").trim();
      box.appendChild(el("a", { cls: "btn-line2", href: "https://venmo.com/" + encodeURIComponent(user) + "?txn=pay&amount=" + amt.toFixed(2) + "&note=" + encodeURIComponent("Deposit " + (number || "")), target: "_blank", rel: "noopener", text: "Pay with Venmo" }));
    }
    if (dep.zelle) {
      var z = el("button", { cls: "btn-line2", type: "button", text: "Zelle: " + dep.zelle + " · tap to copy" });
      z.addEventListener("click", function () { (navigator.clipboard ? navigator.clipboard.writeText(dep.zelle) : Promise.reject()).then(function () { z.textContent = "Copied: " + dep.zelle; }, function () {}); });
      box.appendChild(z);
      box.appendChild(el("div", { cls: "muted", style: "font-size:13px;margin-top:6px", text: "In your bank app, choose Zelle and send " + money(amt) + " to " + dep.zelle + ". Put " + (number || "the quote number") + " in the memo." }));
    }
    box.appendChild(el("div", { cls: "muted", style: "font-size:13px;margin-top:8px", text: "Cash or check is fine too." + (b.phone ? " Questions? Call or text " + b.phone + "." : "") }));
    return box;
  }

  // ---- Form ST-124 on its own (for work already done or quoted earlier) ----
  function renderSt124(d) {
    var p = d.payload || {}, b = p.business || {}, c = p.customer || {}, f = p.st124 || {};
    document.title = (b.name || "Contractor") + " · Form ST-124";
    app.innerHTML = "";
    app.appendChild(el("header", null, [
      el("h1", { text: b.name || "Contractor" }),
      el("div", { cls: "contact", text: [b.phone, b.email, b.address].filter(Boolean).join(" · ") }),
    ]));
    var m = el("main"); app.appendChild(m);
    m.appendChild(el("div", { cls: "title-row" }, [
      el("div", null, [el("div", { cls: "kicker", text: "New York State Form ST-124" }), el("div", { cls: "qnum", text: "Certificate of Capital Improvement" })]),
      el("div", { cls: "muted", style: "text-align:right;font-size:14px", text: "Ref. " + (f.number || d.quote_number) }),
    ]));
    if (d.status === "canceled") m.appendChild(el("div", { cls: "note", text: "This form was replaced or canceled. Please contact the contractor." }));
    m.appendChild(el("div", { cls: "grid" }, [
      el("div", null, [el("div", { cls: "kicker", text: "Customer" }), el("div", { text: c.name || "" }), el("div", { cls: "muted", text: c.address || "" })]),
      el("div", null, [el("div", { cls: "kicker", text: "Contractor" }), el("div", { text: b.name || "" }), el("div", { cls: "muted", text: b.address || "" })]),
      el("div", { style: "grid-column:1/-1" }, [el("div", { cls: "kicker", text: "Where the work is (was) performed" }), el("div", { text: f.site || "" })]),
    ]));
    m.appendChild(el("h2", { text: "Capital improvement" }));
    if (f.project) m.appendChild(el("p", { style: "font-weight:600;margin:4px 0", text: f.project }));
    m.appendChild(el("p", { cls: "scope", text: f.description || "" }));
    m.appendChild(el("h2", { text: "What you're certifying" }));
    m.appendChild(el("ul", { cls: "cert" }, [
      el("li", { text: "You are the owner or tenant (chosen below) of the property above." }),
      el("li", { text: "The work above results in a capital improvement to the property." }),
      el("li", { text: "You'll be responsible for any sales tax, interest and penalty due if the work is found not to qualify as a capital improvement, and you'll pay sales tax on any items that don't become a permanent part of the property." }),
      el("li", { text: "Issuing a false or fraudulent certificate can bring civil or criminal penalties under the Tax Law." }),
    ]));
    m.appendChild(el("p", { style: "font-size:14px" }, [el("a", { href: "https://www.tax.ny.gov/pdf/current_forms/st/st124_fill_in.pdf", target: "_blank", rel: "noopener", text: "Read the official Form ST-124 →" })]));
    if (d.status === "signed") { m.appendChild(signedBlock(d.signer_name, d.signed_at, d.signature_png, b, d.st124)); return; }
    if (d.status !== "sent") return;
    m.appendChild(signBlock(d, b, "st124"));
  }

  // Owner/tenant and "includes" choices for ST-124. Returns {node, value()}.
  function st124Choices(withAgree, agreeText) {
    var box = el("div", { cls: "st124" });
    if (withAgree) {
      box.appendChild(el("div", { cls: "kicker", text: "NY sales tax form ST-124" }));
      box.appendChild(el("p", { style: "font-size:14px;margin:6px 0", text: "The new installation is a capital improvement, so New York requires Form ST-124 for it to be free of sales tax. Your signature below also signs that form for this job." }));
    }
    function radios(name, opts) {
      var row = el("div", { cls: "opts" });
      opts.forEach(function (o) {
        var r = el("input", { type: "radio", name: name, value: o[0] }); if (o[2]) r.checked = true;
        row.appendChild(el("label", null, [r, el("span", { text: o[1] })]));
      });
      return row;
    }
    box.appendChild(el("div", { cls: "q", text: "I am the … of this property" }));
    box.appendChild(radios("st_role", [["owner", "Owner"], ["tenant", "Tenant"]]));
    box.appendChild(el("div", { cls: "q", text: "This job includes items that won't become a permanent part of the property (like a free-standing appliance)" }));
    box.appendChild(radios("st_contract", [["not", "No, it does not", true], ["includes", "Yes, it includes some"]]));
    var ag = null;
    if (withAgree) {
      ag = el("input", { type: "checkbox", id: "stag" });
      box.appendChild(el("label", { cls: "agree", "for": "stag" }, [ag, el("span", { text: agreeText })]));
      box.appendChild(el("p", { style: "font-size:13px;margin:4px 0 0" }, [el("a", { href: "https://www.tax.ny.gov/pdf/current_forms/st/st124_fill_in.pdf", target: "_blank", rel: "noopener", text: "Read the official Form ST-124 →" })]));
    }
    return {
      node: box,
      value: function () {
        var role = box.querySelector("input[name=st_role]:checked"), con = box.querySelector("input[name=st_contract]:checked");
        if (!role) return { error: "Please choose whether you're the owner or tenant." };
        if (!con) return { error: "Please answer the ST-124 question." };
        if (ag && !ag.checked) return { error: "Please check the box to sign Form ST-124." };
        return { role: role.value, contract: con.value };
      },
    };
  }

  function signedBlock(name, at, png, b, st) {
    return el("div", { cls: "signed" }, [
      el("div", { cls: "badge", text: "✓ Signed" }),
      st ? el("div", { cls: "muted", style: "font-size:14px", text: "Includes Form ST-124 (Certificate of Capital Improvement), signed as the " + st.role + "." }) : null,
      png ? el("img", { src: png, alt: "Signature of " + name }) : null,
      el("div", { text: name }),
      el("div", { cls: "muted", text: "Signed electronically " + stamp(at) }),
      el("p", { cls: "muted noprint", style: "font-size:14px", text: "Thank you! " + (b.name || "Your contractor") + " has been notified. Keep a copy for your records:" }),
      el("button", { cls: "btn noprint print", type: "button", text: "Save or print a copy" }),
    ]);
  }

  function signBlock(d, b, mode, after) {
    var box = el("div", { cls: "signbox noprint" });
    box.appendChild(el("div", { cls: "kicker", text: mode === "st124" ? "To sign Form ST-124" : "To approve, sign below" }));
    var st = mode === "st124" ? st124Choices(false) : mode === "quote+st124" ? st124Choices(true, d.agree_st124) : null;
    if (st && mode === "st124") box.appendChild(st.node);
    box.appendChild(el("label", { cls: "field", "for": "nm", text: "Your full name" }));
    var name = el("input", { id: "nm", type: "text", autocomplete: "name", maxlength: "100" });
    box.appendChild(name);
    var chk = el("input", { type: "checkbox", id: "ag" });
    box.appendChild(el("label", { cls: "agree", "for": "ag" }, [chk, el("span", { text: d.agree_text })]));
    if (st && mode === "quote+st124") box.appendChild(st.node);
    box.appendChild(el("label", { cls: "field", text: "Sign with your finger" }));
    var canvas = el("canvas", { id: "pad", "aria-label": "Signature pad" });
    box.appendChild(el("div", { cls: "pad-wrap" }, [canvas, el("div", { cls: "pad-line" }), el("div", { cls: "pad-x", text: "×" })]));
    var clear = el("button", { cls: "link", type: "button", text: "Clear signature" });
    box.appendChild(el("div", { cls: "row" }, [el("span", { cls: "muted", style: "font-size:13px", text: "Signing as the owner or someone allowed to approve this work." }), clear]));
    var err = el("div", { cls: "err", role: "alert" });
    var btnText = mode === "st124" ? "Sign Form ST-124" : "Sign and approve";
    var btn = el("button", { cls: "btn", type: "button", text: btnText });
    box.appendChild(btn); box.appendChild(err);

    // Signature pad
    var ctx, drawn = false, last = null;
    function size() {
      var r = canvas.getBoundingClientRect(), s = window.devicePixelRatio || 1;
      var keep = drawn ? canvas.toDataURL() : null;
      canvas.width = Math.round(r.width * s); canvas.height = Math.round(r.height * s);
      ctx = canvas.getContext("2d"); ctx.scale(s, s);
      ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
      if (keep) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = keep; }
    }
    function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); canvas.setPointerCapture(e.pointerId); last = pos(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, 7); ctx.fillStyle = "#111"; ctx.fill(); drawn = true; });
    canvas.addEventListener("pointermove", function (e) {
      if (!last) return; e.preventDefault(); var p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; drawn = true;
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { canvas.addEventListener(ev, function () { last = null; }); });
    clear.addEventListener("click", function () { drawn = false; ctx.clearRect(0, 0, canvas.width, canvas.height); });
    setTimeout(size, 0);
    window.addEventListener("resize", function () { if (!last) size(); });

    // Signature as a small, trimmed PNG
    function signaturePng() {
      var w = canvas.width, h = canvas.height, data = canvas.getContext("2d").getImageData(0, 0, w, h).data;
      var minX = w, minY = h, maxX = -1, maxY = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (data[(y * w + x) * 4 + 3] > 0) {
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
      if (maxX < 0) return null;
      var pad = 8; minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
      var cw = maxX - minX + 1, ch = maxY - minY + 1, scale = Math.min(1, 600 / cw);
      var out = document.createElement("canvas"); out.width = Math.round(cw * scale); out.height = Math.round(ch * scale);
      out.getContext("2d").drawImage(canvas, minX, minY, cw, ch, 0, 0, out.width, out.height);
      return out.toDataURL("image/png");
    }

    btn.addEventListener("click", function () {
      err.textContent = "";
      var n = name.value.trim();
      if (n.length < 2) { err.textContent = "Please type your full name."; name.focus(); return; }
      if (!chk.checked) { err.textContent = "Please check the box to agree."; return; }
      var stv = null;
      if (st) { stv = st.value(); if (stv.error) { err.textContent = stv.error; return; } }
      var sig = drawn ? signaturePng() : null;
      if (!sig) { err.textContent = "Please sign in the box with your finger."; return; }
      btn.disabled = true; btn.textContent = "Signing…";
      fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "sign", t: token, name: n, agree: true, signature: sig, st124: stv, addons: chosenAddons, choice: chosenOption }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (res.ok) {
            var sb = signedBlock(n, res.j.signed_at, sig, b, stv); box.replaceWith(sb);
            var extra = after ? after() : null; if (extra) sb.after(extra);
            document.querySelectorAll(".optcard").forEach(function (o) { o.disabled = true; });
            wirePrint(); window.scrollTo(0, document.body.scrollHeight); return;
          }
          if (res.j.error === "already_signed") { location.reload(); return; }
          if (res.j.error === "canceled") { err.textContent = "This quote was replaced or canceled. Please contact the contractor."; return; }
          throw new Error();
        })
        .catch(function () { err.textContent = "Couldn't send. Check your connection and tap Sign again."; })
        .finally(function () { if (btn.isConnected) { btn.disabled = false; btn.textContent = btnText; } });
    });
    return box;
  }

  function wirePrint() {
    document.querySelectorAll(".print").forEach(function (b) { b.onclick = function () { window.print(); }; });
  }
  new MutationObserver(wirePrint).observe(app, { childList: true, subtree: true });
})();
</script>
</body>
