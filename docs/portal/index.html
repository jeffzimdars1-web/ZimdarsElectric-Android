<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your account</title>
<style>
  :root {
    --ink: #1c1f21; --muted: #5d656b; --line: #d9dde0; --paper: #ffffff; --wash: #f3f4f5;
    --band: #1c1f21; --neon: #dcff34; --ok: #2e8f5b; --warn: #c2410c;
    --cond: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .sheet { max-width: 680px; margin: 0 auto; background: var(--paper); min-height: 100vh; }
  header { background: var(--band); color: #f2f3f3; padding: 22px 20px 18px; border-bottom: 4px solid var(--neon); }
  header h1 { margin: 0; font: 700 26px/1.1 var(--cond); letter-spacing: .5px; text-transform: uppercase; }
  header .contact { margin-top: 6px; font-size: 13px; color: #c9cdd0; }
  main { padding: 6px 20px 40px; }
  .kicker { font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
  h2 { font: 700 15px/1.2 var(--cond); text-transform: uppercase; letter-spacing: 1px; margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .doc { font: 700 26px/1 var(--cond); text-transform: uppercase; }
  .when { margin-top: 18px; border: 2px solid var(--ink); padding: 16px; display: grid; gap: 4px; }
  .when .day { font: 700 28px/1.1 var(--cond); }
  .when .time { font-size: 18px; font-weight: 600; }
  .when .window { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .muted { color: var(--muted); }
  .note { background: var(--wash); border-left: 3px solid var(--ink); padding: 10px 12px; font-size: 14px; margin: 10px 0; }
  ul { margin: 6px 0 0; padding-left: 20px; } li { margin: 4px 0; }
  button, .btn { font: 700 16px var(--cond); text-transform: uppercase; letter-spacing: 1px; border: 0; cursor: pointer; text-decoration: none; display: block; text-align: center; }
  .btn-main { background: var(--ink); color: var(--neon); padding: 16px 20px; width: 100%; margin-top: 18px; text-decoration: none; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .btn-main[disabled] { opacity: .5; }
  .btn-line { border: 1.5px solid var(--ink); color: var(--ink); background: var(--paper); padding: 13px 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .confirmed { border: 2px solid var(--ok); padding: 14px 16px; margin-top: 18px; }
  .confirmed .badge { color: var(--ok); font: 700 22px var(--cond); text-transform: uppercase; }
  .err { color: var(--warn); font-weight: 600; margin-top: 10px; min-height: 1em; }
  .center { padding: 60px 20px; text-align: center; }
  .small { font-size: 13px; }
  .resched { border: 1.5px dashed var(--ink); padding: 14px; margin-top: 14px; display: grid; gap: 10px; }
  .resched label { font-size: 14px; font-weight: 600; }
  .resched input, .resched textarea, .resched select { width: 100%; font-size: 17px; padding: 10px; border: 1px solid #9aa2a8; border-radius: 0; background: #fff; font-family: inherit; }
  .parts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .parts button { padding: 11px 4px; font-size: 13px; }
  .parts button.on { background: var(--ink); color: var(--neon); }
  .linkbtn { background: none; color: var(--ink); text-decoration: underline; padding: 12px 0 0; font: 600 15px system-ui, sans-serif; text-transform: none; letter-spacing: 0; }
  .card { display: block; border: 1px solid var(--line); padding: 12px 14px; margin-top: 10px; color: inherit; text-decoration: none; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; }
  .card .t { font-weight: 700; font-size: 16px; }
  .card .s { font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: 1px; text-transform: uppercase; padding: 4px 6px; border: 1px solid currentColor; white-space: nowrap; height: fit-content; }
  .card .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .ok { color: var(--ok); } .wait { color: #9a6700; } .gray { color: var(--muted); }
</style>
</head>
<body>
<div class="sheet"><div id="app"><div class="center muted">Loading…</div></div></div>
<script>
(function () {
  "use strict";
  var API = "https://dmaslbfwpsfnnnyushbc.supabase.co/functions/v1/sign";
  var token = new URLSearchParams(location.search).get("t") || "";
  var app = document.getElementById("app");
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { if (k === "text") e.textContent = attrs[k]; else if (k === "cls") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function money(v) { return (Number(v) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" }); }
  function day(ms, time) { return ms ? new Date(ms).toLocaleString("en-US", Object.assign({ timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", year: "numeric" }, time ? { hour: "numeric", minute: "2-digit" } : {})) : ""; }
  function digits(p) { return (p || "").replace(/[^\d+]/g, ""); }
  function message(t, b) { app.innerHTML = ""; app.appendChild(el("div", { cls: "center" }, [el("h2", { text: t }), el("p", { cls: "muted", text: b })])); }
  if (!/^[A-Za-z0-9_-]{20,64}$/.test(token)) { message("Link not valid", "Please use the full link from your text."); return; }
  fetch(API + "?t=" + encodeURIComponent(token), { cache: "no-store" })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) { if (!res.ok || res.j.kind !== "portal") { message("Page not found", "Please ask us for a new link."); return; } render(res.j.payload || {}); })
    .catch(function () { message("Can't load", "Check your connection and open the link again."); });

  var tone = { "Signed": "ok", "Approved": "ok", "Confirmed": "ok", "Paid": "ok", "Done": "ok", "Waiting for you": "wait", "Due": "wait", "Scheduled": "gray", "Canceled": "gray", "Sent": "wait" };
  function render(p) {
    var b = p.business || {}, c = p.customer || {}, items = p.items || [];
    document.title = (b.name || "Your account") + " · " + (c.name || "");
    app.innerHTML = "";
    app.appendChild(el("header", null, [el("h1", { text: b.name || "" }), el("div", { cls: "contact", text: [b.phone, b.email, b.address].filter(Boolean).join(" · ") })]));
    var m = el("main"); app.appendChild(m);
    m.appendChild(el("div", { cls: "title-row" }, [el("div", null, [el("div", { cls: "kicker", text: "Your account" }), el("div", { cls: "doc", text: c.name || "" })])]));
    if (p.updated) m.appendChild(el("p", { cls: "muted small", text: "Updated " + day(p.updated, true) }));
    var groups = [["appt", "Appointments"], ["quote", "Quotes"], ["invoice", "Invoices"], ["st124", "Tax paperwork"]];
    groups.forEach(function (g) {
      var list = items.filter(function (i) { return i.type === g[0]; });
      if (!list.length) return;
      m.appendChild(el("h2", { text: g[1] }));
      list.forEach(function (i) {
        var card = el(i.url ? "a" : "div", i.url ? { cls: "card", href: i.url } : { cls: "card" }, [
          el("div", { cls: "top" }, [el("div", { cls: "t", text: i.title || i.number }), el("span", { cls: "s " + (tone[i.status] || "gray"), text: i.status || "" })]),
          el("div", { cls: "sub", text: [i.number, i.site, i.date ? day(i.date, i.hasTime) : "", i.total ? money(i.total) : ""].filter(Boolean).join(" · ") }),
          i.url ? el("div", { cls: "sub", style: "color:var(--ink);font-weight:600", text: "Open →" }) : null,
        ]);
        m.appendChild(card);
      });
    });
    if (!items.length) m.appendChild(el("p", { cls: "muted", text: "Nothing here yet." }));
    if ((p.properties || []).length > 1) {
      m.appendChild(el("h2", { text: "Your properties" }));
      p.properties.forEach(function (a) { m.appendChild(el("div", { cls: "sub", style: "margin:6px 0" , text: a })); });
    }
    if (b.phone) {
      m.appendChild(el("h2", { text: "Need something?" }));
      m.appendChild(el("div", { cls: "row" }, [el("a", { cls: "btn btn-line", href: "tel:" + digits(b.phone), text: "Call" }), el("a", { cls: "btn btn-line", href: "sms:" + digits(b.phone), text: "Text" })]));
    }
    if (p.book) m.appendChild(el("a", { cls: "btn-main", style: "display:block;text-align:center;margin-top:14px", href: p.book, text: "Request a new visit" }));
  }
})();
</script>
</body>
</html>
